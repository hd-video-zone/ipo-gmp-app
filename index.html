<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPO Premium - Live GMP & Allotment</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f4f7; -webkit-tap-highlight-color: transparent; }
    .tab-OPEN { border-bottom: 3px solid #16a34a; color: #16a34a; font-weight: 700; }
    .tab-UPCOMING { border-bottom: 3px solid #f59e0b; color: #f59e0b; font-weight: 700; }
    .tab-CLOSED { border-bottom: 3px solid #ef4444; color: #ef4444; font-weight: 700; }
  </style>
</head>
<body class="pb-24 text-gray-800 max-w-md mx-auto shadow-xl min-h-screen bg-[#f2f4f7]">

  <header class="bg-white sticky top-0 z-30 shadow-sm">
    <div class="flex items-center justify-between px-3.5 py-2.5">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center font-bold text-gray-700">☰</div>
        <button onclick="setStatus('OPEN')" class="flex items-center gap-1.5 bg-red-50 border border-red-200 px-3 py-1.5 rounded-full text-xs font-semibold text-gray-800">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> Live Subscription
        </button>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleSearch()" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-sm">🔍</button>
        <button onclick="fetchLiveFromWorker()" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-sm">🔄</button>
      </div>
    </div>

    <div id="searchBox" class="hidden px-3.5 pb-2">
      <input type="text" id="searchInput" oninput="renderList()" placeholder="Search Mainboard or SME IPO..." class="w-full border border-gray-300 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
    </div>

    <div class="grid grid-cols-3 text-center border-t border-b border-gray-200 text-xs font-bold text-gray-500 bg-white">
