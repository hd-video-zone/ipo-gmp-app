<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IPO GMP & Fundamentals</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .tab-active { border-bottom: 3px solid #16a34a; color: #16a34a; font-weight: 700; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="pb-20 text-gray-800">

  <!-- Top Header -->
  <header class="bg-white sticky top-0 z-30 shadow-sm">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-sm">IPO</div>
        <div>
          <h1 class="font-bold text-base leading-tight">IPO GMP & Fundamentals</h1>
          <p id="lastUpdated" class="text-[11px] text-gray-400">Updating live data...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="flex items-center gap-1 bg-red-50 text-red-600 text-xs font-semibold px-2.5 py-1 rounded-full border border-red-100">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> Live GMP
        </span>
      </div>
    </div>

    <!-- Status Tabs -->
    <div class="grid grid-cols-3 text-center border-t border-b border-gray-100 text-xs font-semibold text-gray-500 bg-white">
      <button onclick="setStatus('OPEN')" id="tab-OPEN" class="py-3 tab-active">OPEN</button>
      <button onclick="setStatus('UPCOMING')" id="tab-UPCOMING" class="py-3">UPCOMING</button>
      <button onclick="setStatus('CLOSED')" id="tab-CLOSED" class="py-3">CLOSED</button>
    </div>

    <!-- Category Filters & Search -->
    <div class="flex items-center justify-between px-4 py-2.5 bg-gray-50 border-b border-gray-200 gap-2">
      <div class="flex items-center gap-3 text-xs font-bold">
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="checkbox" id="chkMainboard" checked onchange="renderList()" class="w-4 h-4 accent-gray-800 rounded">
          <span>MAINBOARD</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="checkbox" id="chkSme" checked onchange="renderList()" class="w-4 h-4 accent-gray-800 rounded">
          <span>SME</span>
        </label>
      </div>
      <input type="text" id="searchInput" oninput="renderList()" placeholder="Search IPO..." class="bg-white border border-gray-200 rounded-lg px-2.5 py-1 text-xs w-36 focus:outline-none focus:border-blue-500">
    </div>
  </header>

  <!-- IPO Cards Container -->
  <main id="ipoList" class="p-3 space-y-3 max-w-md mx-auto">
    <div class="text-center py-10 text-gray-400 text-sm">Loading Live IPO Data...</div>
  </main>

  <!-- Detail Modal (Fundamentals + Advanced GMP) -->
  <div id="detailModal" class="fixed inset-0 bg-black/50 z-50 hidden flex-col justify-end sm:justify-center">
    <div class="bg-gray-100 w-full max-w-md mx-auto rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto shadow-2xl">
      <!-- Modal Top Bar -->
      <div class="bg-white sticky top-0 px-4 py-3 border-b flex items-center justify-between z-10">
        <h2 id="modalTitle" class="font-bold text-sm truncate pr-4">Company Details</h2>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 font-bold text-gray-600">✕</button>
      </div>

      <div id="modalBody" class="p-3 space-y-3"></div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 flex justify-around py-2 text-[11px] font-semibold text-gray-500 z-30 max-w-md mx-auto">
    <button onclick="setStatus('OPEN')" class="flex flex-col items-center text-amber-600">
      <span class="text-lg">🏠</span><span>IPO</span>
    </button>
    <button onclick="openCalcModal()" class="flex flex-col items-center">
      <span class="text-lg">🧮</span><span>GMP Calc</span>
    </button>
    <button onclick="alert('Allotment links will open directly on listing allotment date!')" class="flex flex-col items-center">
      <span class="text-lg">📢</span><span>Allotment</span>
    </button>
  </nav>

  <script>
    let allIpos = [];
    let currentStatus = 'OPEN';

    async function loadData() {
      try {
        const res = await fetch('ipo_data.json?t=' + Date.now());
        const data = await res.json();
        allIpos = data.ipos || [];
        document.getElementById('lastUpdated').innerText = 'Updated: ' + (data.last_updated || 'Just now');
        
        // Jo OPEN ma koi IPO na hoy to automatic UPCOMING dekhadse
        const hasOpen = allIpos.some(i => i.status === 'OPEN');
        if (!hasOpen && allIpos.length > 0) {
          setStatus('UPCOMING');
        } else {
          renderList();
        }
      } catch (e) {
        document.getElementById('ipoList').innerHTML = '<div class="text-center py-10 text-red-500 text-sm">Failed to load data. Refresh page.</div>';
      }
    }

    function setStatus(status) {
      currentStatus = status;
      ['OPEN', 'UPCOMING', 'CLOSED'].forEach(s => {
        const el = document.getElementById('tab-' + s);
        if (s === status) el.classList.add('tab-active');
        else el.classList.remove('tab-active');
      });
      renderList();
    }

    function renderList() {
      const showMain = document.getElementById('chkMainboard').checked;
      const showSme = document.getElementById('chkSme').checked;
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allIpos.filter(ipo => {
        const matchStatus = ipo.status === currentStatus;
        const matchCat = (ipo.category === 'MAINBOARD' && showMain) || (ipo.category === 'SME' && showSme);
        const matchSearch = ipo.name.toLowerCase().includes(query);
        return matchStatus && matchCat && matchSearch;
      });

      const container = document.getElementById('ipoList');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-gray-400 text-sm shadow-sm">No ${currentStatus} IPOs found in selected filter.</div>`;
        return;
      }

      container.innerHTML = filtered.map(ipo => {
        const gmpColor = ipo.gmp > 0 ? 'text-green-600' : 'text-gray-500';
        const badgeColor = ipo.category === 'SME' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800';
        return `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div class="flex justify-between items-start gap-2 mb-3">
            <h3 class="font-bold text-[15px] text-gray-900 leading-snug">${ipo.name}</h3>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 ${badgeColor}">${ipo.category}</span>
          </div>

          <div class="grid grid-cols-2 gap-y-1.5 text-xs border-b border-gray-100 pb-3">
            <span class="text-gray-500">Offer Date:</span>
            <span class="font-semibold text-right">${ipo.date_range}</span>
            <span class="text-gray-500">Price Band:</span>
            <span class="font-semibold text-right">${ipo.price}</span>
            <span class="text-gray-500">Lot Size:</span>
            <span class="font-semibold text-right">${ipo.lot_size} Shares</span>
            <span class="text-gray-500">Issue Size:</span>
            <span class="font-semibold text-right">${ipo.issue_size}</span>
          </div>

          <div class="grid grid-cols-2 gap-y-1.5 text-xs border-b border-gray-100 py-3">
            <span class="text-gray-500 font-medium">GMP Rumors*:</span>
            <span class="font-bold text-sm text-right ${gmpColor}">₹${ipo.gmp} (${ipo.gmp_percent}%)</span>
            <span class="text-gray-500">Est. Listing:</span>
            <span class="font-bold text-right text-gray-800">₹${ipo.est_listing}</span>
          </div>

          <div class="grid grid-cols-2 gap-y-1.5 text-xs py-3">
            <span class="text-gray-500">Listing Date:</span>
            <span class="font-semibold text-right">${ipo.listing_date}</span>
            <span class="text-gray-500">GMP x Lot (Retail)*:</span>
            <span class="font-bold text-right text-green-700">₹${ipo.retail_profit.toLocaleString('en-IN')}</span>
            <span class="text-gray-500">GMP x Lots (HNI)*:</span>
            <span class="font-bold text-right text-green-700">₹${ipo.hni_profit.toLocaleString('en-IN')}</span>
          </div>

          <div class="flex items-center gap-2 pt-1">
            <button onclick="openDetails(${ipo.id})" class="flex-1 py-2.5 rounded-full border-2 border-gray-800 font-bold text-xs tracking-wide hover:bg-gray-50">
              VIEW FUNDAMENTALS
            </button>
            <button onclick="shareIpo('${ipo.name}', ${ipo.gmp}, ${ipo.gmp_percent})" class="w-10 h-10 rounded-full bg-sky-500 text-white flex items-center justify-center font-bold">
              ↗
            </button>
          </div>
          <p class="text-[10px] text-gray-400 mt-2">* Info is indicative, not an investment advice.</p>
        </div>`;
      }).join('');
    }

    function openDetails(id) {
      const ipo = allIpos.find(x => x.id === id);
      if (!ipo) return;
      const f = ipo.fundamentals;
      document.getElementById('modalTitle').innerText = ipo.name;

      document.getElementById('modalBody').innerHTML = `
        <!-- Overview Card -->
        <div class="bg-white rounded-xl p-3.5 shadow-sm">
          <div class="text-xs font-bold text-gray-400 uppercase mb-2">IPO Overview & GMP</div>
          <div class="flex justify-between items-center bg-green-50 p-3 rounded-lg border border-green-100 mb-3">
            <div>
              <div class="text-xs text-gray-500">Current GMP</div>
              <div class="text-xl font-extrabold text-green-600">₹${ipo.gmp} (${ipo.gmp_percent}%)</div>
            </div>
            <div class="text-right">
              <div class="text-xs text-gray-500">Expected Listing</div>
              <div class="text-lg font-bold text-gray-900">₹${ipo.est_listing}</div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-gray-50 p-2 rounded">Price: <b>${ipo.price}</b></div>
            <div class="bg-gray-50 p-2 rounded">Lot Size: <b>${ipo.lot_size}</b></div>
            <div class="bg-gray-50 p-2 rounded">Retail Profit: <b class="text-green-600">₹${ipo.retail_profit}</b></div>
            <div class="bg-gray-50 p-2 rounded">Subscription: <b class="text-blue-600">${ipo.subscription}</b></div>
          </div>
        </div>

        <!-- Company Fundamentals Card -->
        <div class="bg-white rounded-xl p-3.5 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <span class="font-bold text-sm">Company Fundamentals</span>
            <span class="text-xs font-bold bg-green-100 text-green-700 px-2 py-0.5 rounded-full">${f.score} - ${f.rating}</span>
          </div>
          <div class="grid grid-cols-2 gap-2.5 text-center">
            <div class="border rounded-lg p-2">
              <div class="text-[11px] text-gray-400">P/E Ratio</div>
              <div class="font-bold text-sm">${f.pe}</div>
            </div>
            <div class="border rounded-lg p-2">
              <div class="text-[11px] text-gray-400">EPS</div>
              <div class="font-bold text-sm">${f.eps}</div>
            </div>
            <div class="border rounded-lg p-2">
              <div class="text-[11px] text-gray-400">RoNW / RoE</div>
              <div class="font-bold text-sm text-green-600">${f.roe}</div>
            </div>
            <div class="border rounded-lg p-2">
              <div class="text-[11px] text-gray-400">Debt-to-Equity</div>
              <div class="font-bold text-sm">${f.debt_equity}</div>
            </div>
            <div class="border rounded-lg p-2">
              <div class="text-[11px] text-gray-400">PAT (Profit)</div>
              <div class="font-bold text-sm">${f.pat}</div>
            </div>
            <div class="border rounded-lg p-2">
              <div class="text-[11px] text-gray-400">Revenue</div>
              <div class="font-bold text-sm">${f.revenue}</div>
            </div>
          </div>
        </div>

        <!-- Pros & Cons -->
        <div class="bg-white rounded-xl p-3.5 shadow-sm">
          <div class="font-bold text-sm mb-2">Why to Apply? (Pros & Cons)</div>
          <div class="space-y-1.5 text-xs">
            ${ipo.pros.map(p => `<div class="flex gap-2 text-green-700"><span>✔</span><span>${p}</span></div>`).join('')}
            ${ipo.cons.map(c => `<div class="flex gap-2 text-red-600"><span>✖</span><span>${c}</span></div>`).join('')}
          </div>
        </div>
      `;

      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailModal').classList.add('flex');
    }

    function openCalcModal() {
      document.getElementById('modalTitle').innerText = 'IPO Profit Calculator';
      document.getElementById('modalBody').innerHTML = `
        <div class="bg-white rounded-xl p-4 space-y-3 text-xs">
          <div>
            <label class="font-bold block mb-1">Current GMP (₹)</label>
            <input type="number" id="cGmp" value="25" oninput="calcProfit()" class="w-full border rounded-lg p-2 text-sm font-bold">
          </div>
          <div>
            <label class="font-bold block mb-1">Lot Size (Shares)</label>
            <input type="number" id="cLot" value="100" oninput="calcProfit()" class="w-full border rounded-lg p-2 text-sm font-bold">
          </div>
          <div>
            <label class="font-bold block mb-1">Number of Lots</label>
            <input type="number" id="cNum" value="1" oninput="calcProfit()" class="w-full border rounded-lg p-2 text-sm font-bold">
          </div>
          <div class="bg-green-50 border border-green-200 rounded-xl p-3 text-center">
            <div class="text-gray-500">Estimated Listing Gain</div>
            <div id="cRes" class="text-2xl font-extrabold text-green-600 mt-1">₹2,500</div>
          </div>
        </div>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailModal').classList.add('flex');
    }

    function calcProfit() {
      const g = parseFloat(document.getElementById('cGmp').value) || 0;
      const l = parseFloat(document.getElementById('cLot').value) || 0;
      const n = parseFloat(document.getElementById('cNum').value) || 0;
      document.getElementById('cRes').innerText = '₹' + (g * l * n).toLocaleString('en-IN');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailModal').classList.remove('flex');
    }

    function shareIpo(name, gmp, pct) {
      const text = `${name} Live GMP: ₹${gmp} (${pct}%). Check full fundamentals on our IPO App!`;
      if (navigator.share) navigator.share({ title: name, text });
      else alert(text);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    loadData();
  </script>
</body>
</html>
